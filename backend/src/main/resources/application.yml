server:
  port: ${BACKEND_PORT:8080}
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/air_balloon}
    username: ${POSTGRES_USER:air_balloon}
    password: ${POSTGRES_PASSWORD:change_me}
  flyway:
    locations: classpath:db/migration
tournament:
  mask-other-player-names: true
  live-top-size: 20
  standalone-websocket-enabled: true
  demo-tournament-simulation-enabled: false
