server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/air_balloon}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 100
  jackson:
    deserialization:
      fail-on-unknown-properties: true
    serialization:
      write-dates-as-timestamps: false

app:
  security:
    admin-token-ttl: ${ADMIN_TOKEN_TTL:PT8H}
    demo-player-token: ${GAME_TOKEN:demo-player-token}
    user-token: ${USER_TOKEN:}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  demo:
    enabled: ${DEMO_DATA_ENABLED:true}
    sync-admin-password: ${DEMO_SYNC_ADMIN_PASSWORD:true}
    admin-username: ${ADMIN_USER:admin}
    admin-password: ${ADMIN_PASSWORD:admin}
  game:
    fixed-seed: ${GAME_FIXED_SEED:}

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"
