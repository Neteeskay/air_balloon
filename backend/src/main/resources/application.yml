spring:
  application:
    name: air-balloon
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/air_balloon}
    username: ${POSTGRES_USER:air_balloon}
    password: ${POSTGRES_PASSWORD:change_me}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 10000
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${BACKEND_PORT:8080}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  admin-token: ${ADMIN_TOKEN:}
  allow-fixed-seed: false
